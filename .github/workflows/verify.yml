name: verify

on:
  push:
    branches: [master, main, "fix/**", "feat/**"]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Package evidence
        if: always()
        run: node scripts/package-evidence.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nft-validation-evidence
          path: |
            playwright-report/
            test-results/
            reports/lighthouse/
            docs/lighthouse/
            evidence/
          if-no-files-found: ignore
